# Build the site image on every push to main and publish it to GitHub Container Registry.
# The server checks for a new :latest every few minutes and restarts the site when it changes.
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: NEXT_PUBLIC_SITE_URL=https://omidfaryabi.ir
          tags: |
            ghcr.io/omidfa123/omidfaryabi.ir:latest
            ghcr.io/omidfa123/omidfaryabi.ir:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
